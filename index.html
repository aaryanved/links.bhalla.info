    <!-- Runs before first paint, same rule as bhalla.info: a fresh visit opens
         on the OS preference, a toggle only holds for the session. -->
    <script>
      try {
        var s = sessionStorage.getItem("theme");
        document.documentElement.dataset.theme = s || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..900&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/main.js" defer></script>
  </head>
  <body>
    <!-- Icons are Phosphor (phosphoricons.com): ArrowUpRight bold and XLogo
         bold. Defined once, used by reference. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-arrow" viewBox="0 0 256 256"><path d="M204,64V168a12,12,0,0,1-24,0V93L72.49,200.49a12,12,0,0,1-17-17L163,76H88a12,12,0,0,1,0-24H192A12,12,0,0,1,204,64Z" /></symbol>

    <div class="page">
      <header class="top">
        <!-- The black hole is the theme switch here too. -->
        <button class="hole" type="button" aria-label="Invert the page">
          <svg viewBox="-40 -40 80 80" aria-hidden="true">
            <g transform="rotate(-22)">
              <ellipse class="ring r1" rx="22" ry="6" />
              <ellipse class="ring r2" rx="29" ry="8.2" />
              <ellipse class="ring r3" rx="36" ry="10.4" />
            </g>
            <circle r="9" />
          </svg>
        </button>
      </header>

      <h1 class="display name">
        <span class="mask"><span style="--i: 0">Aaryan Ved Bhalla</span></span>

      <!-- The personal site first, then the socials, in bhalla.info's order. -->
      <nav class="links" aria-label="Links">
        <a class="row site rise" style="--i: 3" href="https://bhalla.info">
          <span class="row-title">bhalla.info</span>
          <span class="row-meta mono">Personal site</span>
          <svg class="row-arrow" aria-hidden="true"><use href="#i-arrow" /></svg>

        <a class="row rise" style="--i: 4" href="https://github.com/aaryanved/" target="_blank" rel="noopener noreferrer">
